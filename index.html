<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TarkovZero — Customs</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">TarkovZero</div>
        <h1>Customs <button id="view-toggle" class="view-toggle" title="Switch 2D / 3D (3D is beta)">3D</button></h1>
        <div id="status" class="muted">Loading data…</div>
        <div id="layers"></div>
        <div id="live"></div>
        <div id="hint3d" class="muted">3D: drag to pan · right-drag or Ctrl+drag to rotate &amp; tilt · scroll to zoom</div>
        <div id="coords" class="muted mono"></div>
        <p class="credit">Tiles &amp; data: <a href="https://tarkov.dev" target="_blank">tarkov.dev</a></p>
      </aside>
      <div id="map"></div>
      <div id="map3d"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
